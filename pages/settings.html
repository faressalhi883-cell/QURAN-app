<div class="section-title">
  <h2>⚙️ الإعدادات</h2>
</div>

<div class="settings-group">
  <label>نوع الخط:</label>
  <select id="fontSelect">
    <option value="Amiri">أميري (افتراضي)</option>
    <option value="'Traditional Arabic'">نسخ تقليدي</option>
    <option value="'Scheherazade New'">شهرزاد</option>
    <option value="sans-serif">بدون زخرفة</option>
  </select>
</div>

<div class="settings-group">
  <label>حجم الخط: <span id="sizeValue">22</span>px</label>
  <input type="range" id="fontSize" min="16" max="40" value="22" step="1">
</div>

<div class="settings-group">
  <label>الوضع:</label>
  <select id="themeSelect">
    <option value="dark">داكن</option>
    <option value="light">فاتح</option>
  </select>
</div>

<div class="settings-group" style="text-align:center;">
  <p style="color:#8b949e; font-size:14px;">تطبيق القرآن الكريم - الإصدار 1.0</p>
</div>
