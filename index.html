<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>القرآن الكريم</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Amiri', 'Traditional Arabic', serif;
    background-color: #0d1117;
    color: #e6edf3;
    padding: 15px;
  }
  header {
    text-align: center;
    padding: 15px 0;
    border-bottom: 2px solid #238636;
    margin-bottom: 20px;
  }
  h1 { color: #58a6ff; font-size: 24px; }
  select {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid #30363d;
    background-color: #161b22;
    color: #e6edf3;
    margin-bottom: 20px;
    font-family: inherit;
  }
  #verses {
    line-height: 2.5;
    font-size: 22px;
    text-align: justify;
    word-spacing: 2px;
  }
  .verse {
    display: inline;
    padding: 2px 0;
  }
  .verse-number {
    display: inline-block;
    background-color: #238636;
    color: white;
    border-radius: 50%;
    width: 35px;
    height: 35px;
    line-height: 35px;
    text-align: center;
    font-size: 16px;
    margin: 0 5px;
    font-family: sans-serif;
    vertical-align: middle;
  }
  .loading { text-align: center; font-size: 20px; color: #8b949e; margin-top: 50px; }
  .error { color: #f85149; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1>📖 القرآن الكريم</h1>
</header>

<select id="surahSelect">
  <option value="">جاري تحميل السور...</option>
</select>

<div id="verses">
  <p class="loading">اختر سورة من القائمة لعرض الآيات</p>
</div>

<script>
  const apiBase = 'https://api.alquran.cloud/v1';
  const surahSelect = document.getElementById('surahSelect');
  const versesDiv = document.getElementById('verses');

  // 1. جلب قائمة السور
  async function loadSurahs() {
    try {
      const res = await fetch(`${apiBase}/surah`);
      const data = await res.json();
      surahSelect.innerHTML = '<option value="">-- اختر سورة --</option>';
      data.data.forEach(surah => {
        const option = document.createElement('option');
        option.value = surah.number;
        option.textContent = `${surah.number}. ${surah.name} (${surah.englishName})`;
        surahSelect.appendChild(option);
      });
    } catch (err) {
      surahSelect.innerHTML = '<option value="">خطأ في التحميل</option>';
      console.error(err);
    }
  }

  // 2. جلب آيات السورة المختارة
  async function loadVerses(surahNumber) {
    if (!surahNumber) return;
    versesDiv.innerHTML = '<p class="loading">جاري تحميل الآيات...</p>';
    try {
      const res = await fetch(`${apiBase}/surah/${surahNumber}`);
      const data = await res.json();
      const ayahs = data.data.ayahs;
      let html = '';
      ayahs.forEach(ayah => {
        // إزالة البسملة من أول آية إذا كانت السورة ليست الفاتحة أو التوبة (لتجنب التكرار)
        let text = ayah.text;
        if (surahNumber != 1 && surahNumber != 9 && ayah.numberInSurah === 1) {
          // إزالة البسملة من بداية النص إن وجدت
          text = text.replace(/^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/, '');
        }
        html += `<span class="verse">${text} <span class="verse-number">${ayah.numberInSurah}</span></span> `;
      });
      versesDiv.innerHTML = html;
    } catch (err) {
      versesDiv.innerHTML = '<p class="error">حدث خطأ في تحميل الآيات. تأكد من اتصالك بالإنترنت.</p>';
      console.error(err);
    }
  }

  // 3. الأحداث
  surahSelect.addEventListener('change', (e) => {
    loadVerses(e.target.value);
  });

  // تشغيل التطبيق
  loadSurahs();
</script>
</body>
</html>
